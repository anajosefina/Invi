<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eeebeb"><meta name="description" content="¡Nos recibimos! Jo y Mati · 18 de diciembre de 2026"><title>¡Nos recibimos! | Jo y Mati</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eeebeb;color:#111;font-family:Arial,Helvetica,sans-serif}.wrap{width:min(100%,540px);margin:auto;box-shadow:0 0 35px #00000010}.panel{position:relative;width:100%;line-height:0}.panel>img{display:block;width:100%;height:auto}.overlay{position:absolute;left:7%;right:7%;display:flex;align-items:center;flex-direction:column;gap:10px;line-height:1.25}.count{top:48%;background:#eeebebeb;padding:12px 8px;border-radius:14px;text-align:center}.count h2{font-size:clamp(14px,4vw,21px);margin:0 0 5px}.digits{display:flex;gap:7px;justify-content:center}.unit{min-width:56px;background:white;border:1px solid #c7c7c7;border-radius:9px;padding:7px 5px}.num{font-size:clamp(18px,5vw,27px);font-weight:900}.cap{font-size:10px;letter-spacing:.06em}.place{top:48%}.rsvp{top:49%}.btn{display:block;width:min(100%,340px);border:2px solid #111;border-radius:100px;padding:14px 16px;text-align:center;text-decoration:none;background:#111;color:white;font-size:clamp(14px,4vw,18px);font-weight:800;line-height:1.2;box-shadow:0 3px 12px #0002}.btn.secondary{background:#fff;color:#111}.footer{text-align:center;font-size:12px;padding:18px 10px;background:#eeebeb;line-height:1.4}@media(min-width:541px){.count h2{font-size:21px}.num{font-size:27px}.btn{font-size:18px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.music-toggle{position:fixed;right:18px;bottom:20px;z-index:1000;display:flex;align-items:center;gap:9px;background:#111;color:#fff;border:2px solid white;border-radius:999px;padding:13px 17px;font:700 14px Arial,Helvetica,sans-serif;box-shadow:0 4px 18px #0006;cursor:pointer}.music-toggle:focus-visible{outline:3px solid #ffbf47;outline-offset:3px}.music-toggle[aria-pressed="true"]{background:#264b32}@media(max-width:400px){.music-toggle{right:10px;bottom:12px;padding:11px 13px;font-size:12px}}

.welcome{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(155deg,#f5efe7,#d6c6b3);text-align:center}.welcome-card{max-width:420px;width:100%;background:#fffef8;border:2px solid #30291f;border-radius:22px;padding:38px 22px;box-shadow:0 12px 35px #0002;line-height:1.5}.welcome-card h1{font-size:clamp(28px,7vw,40px);margin:0 0 12px}.welcome-card p{font-size:17px;margin:0 0 24px}.enter-btn{border:0;background:#171717;color:white;border-radius:999px;padding:18px 26px;font-size:19px;font-weight:bold;cursor:pointer;width:100%}.welcome[hidden]{display:none}.welcome-status{min-height:22px;font-size:13px;margin-top:12px;color:#70452d}
</style></head><body><div id="welcome" class="welcome"><div class="welcome-card"><h1>¡Bienvenidos a nuestra recibida! 🎉</h1><p>Jo y Mati · 18 de diciembre de 2026</p><button id="enterParty" class="enter-btn" type="button">🎶 Entrar a la fiesta</button><div id="welcomeStatus" class="welcome-status" aria-live="polite"></div></div></div><main class="wrap">
<section class="panel" aria-label="¡Nos recibimos! 18 de diciembre de 2026"><img src="1.png" alt="Portada de la invitación: Nos recibimos, 18 de diciembre de 2026" fetchpriority="high"></section>
<section class="panel" aria-label="Reservá la fecha"><img src="2.png" alt="Reservá la fecha" loading="lazy"><div class="overlay count"><h2>Falta muy poquito para festejar</h2><div class="digits" id="countdown" aria-live="off"><div class="unit"><div class="num" id="days">--</div><div class="cap">DÍAS</div></div><div class="unit"><div class="num" id="hours">--</div><div class="cap">HORAS</div></div><div class="unit"><div class="num" id="minutes">--</div><div class="cap">MIN</div></div><div class="unit"><div class="num" id="seconds">--</div><div class="cap">SEG</div></div></div></div></section>
<section class="panel" aria-label="El lugar"><img src="3.png" alt="El lugar" loading="lazy"><div class="overlay place"><a class="btn" href="https://maps.app.goo.gl/gFiTYa1LCjXPgYnYA" target="_blank" rel="noopener noreferrer">📍 Cómo llegar</a></div></section>
<section class="panel" aria-label="Confirmá tu asistencia"><img src="4.png" alt="Confirmá tu asistencia. Nos encantaría verte" loading="lazy"><div class="overlay rsvp"><a class="btn" href="https://wa.me/5492266516695?text=%C2%A1Hola%21%20Confirmo%20mi%20asistencia%20a%20la%20recibida%20de%20Jo%20y%20Mati%20%F0%9F%8E%89" target="_blank" rel="noopener noreferrer">💬 Confirmar con Jo</a><a class="btn secondary" href="https://wa.me/5492266446228?text=%C2%A1Hola%21%20Confirmo%20mi%20asistencia%20a%20la%20recibida%20de%20Jo%20y%20Mati%20%F0%9F%8E%89" target="_blank" rel="noopener noreferrer">💬 Confirmar con Mati</a></div></section>
<footer class="footer">Jo y Mati · 18 de diciembre de 2026 · 12:00 h</footer></main>
<audio id="backgroundMusic" src="musica.mp3" loop preload="none"></audio>
<button type="button" id="musicToggle" class="music-toggle" aria-label="Reproducir música" aria-pressed="false"><span id="musicIcon" aria-hidden="true">♫</span><span id="musicLabel">Reproducir música</span></button>
<script>const end=new Date('2026-12-18T12:00:00-03:00').getTime();function tick(){let d=Math.max(0,Math.floor((end-Date.now())/1000));const values=[Math.floor(d/86400),Math.floor(d%86400/3600),Math.floor(d%3600/60),d%60];['days','hours','minutes','seconds'].forEach((id,i)=>document.getElementById(id).textContent=String(values[i]).padStart(2,'0'));}tick();setInterval(tick,1000);const music=document.getElementById('backgroundMusic');const musicButton=document.getElementById('musicToggle');const musicLabel=document.getElementById('musicLabel');const musicIcon=document.getElementById('musicIcon');function syncMusic(){const playing=!music.paused;musicButton.setAttribute('aria-pressed',String(playing));musicButton.setAttribute('aria-label',playing?'Pausar música':'Reproducir música');musicLabel.textContent=playing?'Pausar música':'Reproducir música';musicIcon.textContent=playing?'Ⅱ':'♫';}musicButton.addEventListener('click',async()=>{if(music.paused){try{await music.play();}catch(e){musicLabel.textContent='No se pudo reproducir';}}else{music.pause();}syncMusic();});music.addEventListener('play',syncMusic);music.addEventListener('pause',syncMusic);
const welcome=document.getElementById('welcome');const enterParty=document.getElementById('enterParty');const welcomeStatus=document.getElementById('welcomeStatus');enterParty.addEventListener('click',()=>{welcome.hidden=true;music.play().then(syncMusic).catch(()=>{syncMusic();musicLabel.textContent='Tocá para escuchar música';});});
</script></body></html>
